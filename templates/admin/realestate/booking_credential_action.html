{% extends "admin/base_site.html" %}

{% block content %}
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <ul>{% for credential in queryset %}<li>{{ credential }}</li>{% endfor %}</ul>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="action" value="{{ action_name }}">
    <input type="hidden" name="confirm_booking_action" value="{{ confirmation }}">
    {% for credential in queryset %}<input type="hidden" name="{{ action_checkbox_name }}" value="{{ credential.pk }}">{% endfor %}
    {% if requires_reason %}
      <p><label for="id_reason"><strong>Reason</strong></label><br><textarea id="id_reason" name="reason" required rows="4" cols="60"></textarea></p>
    {% endif %}
    <button type="submit" class="{% if requires_reason %}deletelink{% else %}default{% endif %}">Confirm</button>
    <a href="{{ cancel_url }}" class="button cancel-link">Cancel</a>
  </form>
{% endblock %}
